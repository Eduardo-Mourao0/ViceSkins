version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: repository
        out: internal/repository
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        rename:
          avatar_url: AvatarURL
          icon_url: IconURL
          present_asset_ids: PresentAssetIDs
          seller_avatar_url: SellerAvatarURL
          buyer_avatar_url: BuyerAvatarURL
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
