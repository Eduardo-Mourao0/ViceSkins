version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: repository
        out: internal/repository
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        rename:
          avatar_url: AvatarURL
          icon_url: IconURL
          present_asset_ids: PresentAssetIDs
          seller_avatar_url: SellerAvatarURL
          buyer_avatar_url: BuyerAvatarURL
          trade_url: TradeURL
          buyer_trade_url: BuyerTradeURL
          steam_api_key_enc: SteamAPIKeyEnc
          steam_api_key_last4: SteamAPIKeyLast4
          seller_api_key_enc: SellerAPIKeyEnc
          seller_steam_id: SellerSteamID
          buyer_steam_id: BuyerSteamID
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
