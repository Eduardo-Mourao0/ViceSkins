services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: viceskins
      POSTGRES_PASSWORD: viceskins
      POSTGRES_DB: viceskins
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U viceskins -d viceskins"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./api/db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://viceskins:viceskins@postgres:5432/viceskins?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./api
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://viceskins:viceskins@postgres:5432/viceskins?sslmode=disable
      PUBLIC_API_URL: http://localhost:8080
      AUTH_REDIRECT_URL: ${AUTH_REDIRECT_URL:-http://localhost:3000/inventory}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      COOKIE_SECURE: "false"
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-200}
      # Proteção de troca da Steam é 7 dias (168h). Em dev, coloque algo como 2m no .env.
      TRADE_HOLD_DURATION: ${TRADE_HOLD_DURATION:-168h}
      SIM_TRADE_ACCEPT_AFTER: ${SIM_TRADE_ACCEPT_AFTER:-15s}
      SELLER_SEND_TIMEOUT: ${SELLER_SEND_TIMEOUT:-12h}
      BUYER_ACCEPT_TIMEOUT: ${BUYER_ACCEPT_TIMEOUT:-12h}
      # simulated (padrão) ou steam (P2P real: inventário público + API key opcional do vendedor)
      TRADE_PROVIDER: ${TRADE_PROVIDER:-simulated}
      TRADE_CHECK_INTERVAL: ${TRADE_CHECK_INTERVAL:-}
      # Quem resolve disputas: SteamID64 separados por vírgula.
      ADMIN_STEAM_IDS: ${ADMIN_STEAM_IDS:-}
      # Criptografa as API keys dos vendedores. Valor de dev: troque em produção.
      SECRETS_KEY: ${SECRETS_KEY:-ZGV2LW9ubHktc2VjcmV0cy1rZXktY2hhbmdlLW1lISE=}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      args:
        API_INTERNAL_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
