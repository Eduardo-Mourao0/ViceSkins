services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: viceskins
      POSTGRES_PASSWORD: viceskins
      POSTGRES_DB: viceskins
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U viceskins -d viceskins"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./api
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://viceskins:viceskins@postgres:5432/viceskins?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
